<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Replaced at build time by the `bic:csp` plugin in electron.vite.config.ts:
      a strict policy for the packaged app, a looser one for the dev server.
      The window loads over file:// once packaged, which session.webRequest
      never sees, so this tag is what actually protects the shipped app.
    -->
    <meta http-equiv="Content-Security-Policy" content="%CSP%" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>BIC Archiver</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
